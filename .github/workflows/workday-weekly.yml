name: Workday Weekly Digest

# Every Monday, reads the agent's master CSV and posts a summary to Slack
# (how many new this week, total found, whether the search is tapped out).

on:
  schedule:
    - cron: '0 9 * * 1'      # Mondays 09:00 UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post weekly Workday digest to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 digests/weekly_summary.py
